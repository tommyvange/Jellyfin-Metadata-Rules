        page.addEventListener('viewhide',function(){state.visible=false;clearInterval(state.poll);clearTimeout(state.searchTimer);state.poll=null;});
        window.addEventListener('beforeunload',function(event){if(state.dirty){event.preventDefault();event.returnValue='';}});
    }());
    </script>
